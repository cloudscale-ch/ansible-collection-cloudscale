name: Ansible Collection Integration Tests

permissions: {}

on:
  schedule:
    - cron: "0 5 * * *" # UTC
  push:
    tags:
      - "v*"
    branches:
      - "test/**"
  workflow_dispatch:
jobs:
  integration-test:
    permissions:
      contents: read
    name: >-
      Integration test on ansible-core ${{ matrix.ansible }}
      using Python ${{ matrix.python }}
    runs-on: ${{ vars.RUNNER_OS }}
    defaults:
      run:
        working-directory: ansible_collections/cloudscale_ch/cloud
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include: ${{ fromJSON(vars.ANSIBLE_PYTHON_MATRIX) }}
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: ansible_collections/cloudscale_ch/cloud
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install ansible
        run: |
          if [ "${{ matrix.ansible }}" = "devel" ] ; then
            pip install https://github.com/ansible/ansible/archive/devel.tar.gz
          else
            pip install 'ansible-core~=${{ matrix.ansible }}'
          fi
          pip install -r tests/requirements.txt

      - name: Build and install collection
        run: |
          ansible-galaxy collection build .
          ansible-galaxy collection install *.gz

      - name: Add config file
        env:
          CONFIG_FILE: ${{ secrets.CONFIG_FILE }}
          INI_FILE: tests/integration/cloud-config-cloudscale.ini
        run: |
          echo -n "$CONFIG_FILE" > $INI_FILE && [ -s $INI_FILE ] || (>&2 echo no secrets provided; exit 1)

      - name: Ensure no other integration test is currently running
        uses: softprops/turnstyle@afaccda0f3c0136fb7cb4a734b9b96be03599948 # v3.3.2
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          same-branch-only: false

      - name: Run the tests
        run: >-
          ansible-test
          integration
          --docker
          --python ${{ matrix.python }}
          -v
          --diff
          --color
          --allow-unsupported
          --continue-on-error
          --coverage
          cloud/cloudscale/

      - name: Generate coverage report.
        run: >-
          ansible-test
          coverage xml
          -v
          --requirements
          --group-by command
          --group-by version

      - uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          fail_ci_if_error: false

      - name: Send mail in case of failure
        id: send_mail
        if: ${{ failure() && github.event_name == 'schedule' }}
        shell: python3 {0}
        run: |
          from smtplib import SMTP
          from email.message import EmailMessage

          email = EmailMessage()
          email['TO'] = '${{ secrets.CRON_RCPT }}'
          email['FROM'] = 'noreply@github.com'
          email['Subject'] = 'Ansible Cloud Module Integration Test Failure'
          email.set_content("""
          Integration tests using ansible-core ${{ matrix.ansible }} on Python ${{ matrix.python }} failed:
          https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          """)

          with SMTP('${{ secrets.MAILSERVER }}') as smtp:
            smtp.starttls()
            smtp.send_message(email)
