---
- name: Subnet test run
  block:
    - import_tasks: failures.yml
    - import_tasks: setup.yml
    - import_tasks: tests.yml
  module_defaults:
    group/cloudscale_ch.cloud.cloudscale:
      api_url: "{{ cloudscale_api_url }}"
  always:
    - import_role:
        name: common
        tasks_from: cleanup_networks
