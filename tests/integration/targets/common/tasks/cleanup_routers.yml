---
- name: List all routers
  uri:
    url: '{{ cloudscale_api_url }}/routers'
    headers:
      Authorization: 'Bearer {{ cloudscale_api_token }}'
    status_code: 200
  register: router_list

- name: Remove all routers created by this test run
  cloudscale_ch.cloud.router:
    uuid: '{{ item.uuid }}'
    state: absent
  when: cloudscale_resource_prefix in item.name
  with_items: '{{ router_list.json }}'
  loop_control:
    label: '{{ item.name }} ({{ item.uuid }})'
